<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formularios · All Solution Ibiza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#222;--mute:#666;--field:#fcfcfc;--line:#cfcfcf;--char:#2f2e2b;--gold:#c2a76b;--a:#b5471b;--at:#fdf3eb;--am:#e8b896;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--ink:#eee;--mute:#aaa;--field:#222220;--line:#444;--char:#0f0f0e}}
:root[data-theme="dark"]{--bg:#171716;--ink:#eee;--mute:#aaa;--field:#222220;--line:#444;--char:#0f0f0e}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Sans 3','Calibri Light',Calibri,sans-serif;font-weight:300}
header{background:var(--char);text-align:center;padding:26px 16px 20px;border-bottom:8px solid var(--a);transition:border-color .3s}
.logo b{display:block;font:600 44px/1 Arial,Helvetica,sans-serif;color:#fff;letter-spacing:1px}
.logo i{display:block;font:600 17px/1.5 Arial,Helvetica,sans-serif;color:#fff;letter-spacing:4px;font-style:normal;margin-top:6px}
.logo u{display:block;font:700 15px/1.4 'Playfair Display',Georgia,serif;color:var(--gold);letter-spacing:10px;text-decoration:none;padding-left:10px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px;margin:22px auto 0;padding:0 14px}
nav button{font:400 13px 'Source Sans 3',sans-serif;letter-spacing:2px;text-transform:uppercase;border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 14px;border-radius:2px;cursor:pointer}
nav button[aria-selected=true]{background:var(--a);border-color:var(--a);color:#fff}
main{max-width:620px;margin:0 auto;padding:10px 18px 60px;text-align:center}
h1{font:900 clamp(26px,6vw,42px)/1.15 'Playfair Display',Georgia,serif;margin:26px 0 6px;letter-spacing:.5px}
.orn{color:var(--a);letter-spacing:6px;font-size:15px;margin-bottom:10px}
.intro{font-size:18px;color:var(--mute);margin:0 0 30px}
form{display:grid;grid-template-columns:1fr 1fr;gap:22px 16px;text-align:center}
.f{grid-column:1/-1}.f.h{grid-column:span 1}
.f[hidden]{display:none}
label{display:block;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:7px;color:var(--ink);font-weight:400}
.hint{display:block;font-size:12px;letter-spacing:0;text-transform:none;color:var(--mute);margin-top:2px}
input,select,textarea{width:100%;font:300 17px 'Source Sans 3',sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:2px;padding:13px 14px;outline:none;transition:.2s}
select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--a) 50%),linear-gradient(135deg,var(--a) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{border-color:var(--a);background:var(--at);box-shadow:0 0 0 3px var(--am)}
@media (prefers-color-scheme:dark){input:focus,select:focus,textarea:focus{background:var(--field);box-shadow:0 0 0 3px var(--a)}}
textarea{min-height:130px;resize:vertical}textarea.big{min-height:230px}
.ph{display:grid;grid-template-columns:150px 1fr;gap:10px}
.pv{font-size:13px;color:var(--mute);margin-top:6px;min-height:18px;letter-spacing:.5px}
.req{color:#c00;margin-left:3px}
button.go{grid-column:1/-1;justify-self:center;margin-top:8px;font:600 14px 'Source Sans 3',sans-serif;letter-spacing:3px;text-transform:uppercase;background:var(--a);color:#fff;border:0;padding:16px 46px;border-radius:2px;cursor:pointer}
button.go:hover{filter:brightness(1.1)}
.done{display:none;text-align:left;border:1px solid var(--a);background:var(--at);padding:22px;border-radius:2px;color:#222}
.done h2{font:700 24px 'Playfair Display',Georgia,serif;margin:0 0 4px;text-align:center}
.done p{text-align:center;margin:0 0 14px}
.done pre{white-space:pre-wrap;font:400 15px/1.6 'Source Sans 3',sans-serif;margin:0 0 18px;background:#fff;padding:14px;border:1px solid var(--am)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.row button,.row a{font:400 13px 'Source Sans 3',sans-serif;letter-spacing:2px;text-transform:uppercase;padding:11px 16px;border:1px solid var(--a);background:#fff;color:var(--a);cursor:pointer;border-radius:2px;text-decoration:none}
.row a.main{background:var(--a);color:#fff}
@media (max-width:520px){form{grid-template-columns:1fr}.f.h{grid-column:1/-1}.ph{grid-template-columns:120px 1fr}}
</style>
</head>
<body>
<header><div class="logo"><b>ALL</b><i>SOLUTION</i><u>IBIZA</u></div></header>
<nav id="tabs" role="tablist"></nav>
<main>
  <h1 id="ttl"></h1><div class="orn">——— ◆ ———</div><p class="intro" id="intro"></p>
  <form id="frm" novalidate></form>
  <div class="done" id="done"><h2>Solicitud preparada</h2><p>Revise los datos y envíenoslos.</p><pre id="sum"></pre>
    <div class="row"><a id="em" class="main" hidden>Enviar por email</a><button id="cp">Copiar resumen</button><button id="dl">Descargar</button><button id="nw">Nuevo formulario</button></div></div>
</main>
<script>
// ▼ Escriba aquí el email donde quiere recibir las solicitudes (deje "" para ocultar el botón)
const EMAIL_DESTINO="j.nariom@gmail.com";

const REST=["Cala Gracioneta","Casa Maca","Hostal La Torre","Sa Capella","IT","La Cava","Villa Mercedes","Jul's","El Carnicero","Beach House","Finca La Plaza","Tigre Morado","Pomelo","Teyo","Bambuddha","Casa Linda"];
const HAM=["Cala Gracioneta","Beach House","Tigre Morado","Pomelo"];
const PRE=["+34 España","+33 Francia","+44 Reino Unido","+49 Alemania","+39 Italia","+351 Portugal","+31 P. Bajos","+32 Bélgica","+41 Suiza","+353 Irlanda","+46 Suecia","+47 Noruega","+45 Dinamarca","+48 Polonia","+7 Rusia","+1 EE.UU./Canadá"];
// [id, etiqueta, tipo, opciones/placeholder, media-anchura, obligatorio]
const N=["nombre","Nombre","text","",1,1],A=["apellido","Apellido","text","",1,1],T=["tel","Teléfono","tel","",0,1],M=["mail","Email","email","",0,1];
const AD=["adultos","Nº de adultos","num","",1,1],NI=["ninos","Nº de niños (-18)","num","",1,0],OB=["obs","Observaciones","area","",0,0];
const BV=["25000 – 45000 €","46000 – 65000 €","66000 – 85000 €","86000 – 105000 €","106000 € en adelante"];
const BH=["1000 – 3000 €","3100 – 5000 €","5100 – 7000 €","7100 – 10000 €","10000 € en adelante"];
const BN=BH;
const ZN=["Ibiza","Norte (San Juan)","Este (Santa Eulalia)","Sur (San José)","Oeste (San Antonio)"];
const est=B=>[["entrada","Día de entrada","date","",1,1],["salida","Día de salida","date","",1,1],AD,NI,["hab","Nº de habitaciones","num","",1,0],["budget","Budget por la estancia","bud",B,1,0],["zona","Zona","sel",ZN,0,0,"","Seleccione zona preferida"],N,A,T,M,OB];
const F={
rest:{t:"Restaurante",i:"Complete los datos de la reserva.",c:["#b5471b","#fdf3eb","#e8b896"],f:[N,A,T,M,["rest","Restaurante","sel",REST,0,1],["tipo","Restaurante o hamacas","sel",["Restaurante","Hamacas"],0,0,"Solo con Cala Gracioneta, Beach House, Tigre Morado o Pomelo"],["fecha","Fecha","date","",1,1],["hora","Horario","time","",1,1],AD,NI,OB]},
vill:{t:"Villas",i:"Complete los datos de la solicitud.",c:["#55703c","#f2f7ec","#bbcfa6"],f:est(BV)},
hot:{t:"Hoteles",i:"Complete los datos de la solicitud.",c:["#1f3a68","#eff3fa","#a9bbdb"],f:est(BH)},
naut:{t:"Servicios náuticos",i:"Complete los datos de la solicitud.",c:["#0b6e75","#edf8f9","#9ccfd3"],f:[["salida","Día de salida","date","",1,1],["hs","Horario de salida","time","",1,1],["regreso","Día de regreso","date","",1,1],["hr","Horario de regreso","time","",1,1],AD,NI,["barco","Tipo de embarcación","sel",["Barco a motor","Barco a vela","Moto de agua"],1,1],["budget","Budget por el alquiler con patrón","bud",BN,1,0],["zona","Zona marina","sel",["Botafoch","Puerto de Sant Antoni","Puerto de Sant Eulària"],0,1,"","Seleccione zona marina"],N,A,T,M,OB]},
trans:{t:"Servicios transfers",i:"Complete los datos de la solicitud.",c:["#4a4f57","#f3f4f5","#bdc1c7"],f:[N,A,T,M,["pax","Nº de pasajeros","num","",1,1],["serv","Tipo de servicio","sel",["Trayecto","3 horas a disposición","6 horas a disposición","9 horas a disposición","12 horas a disposición"],1,1],["fecha","Fecha de recogida","date","",1,1],["hora","Hora de recogida","time","",1,1],["pick","Pick-up point","text","",1,1],["dest","Destino","text","",1,1],OB]},
conc:{t:"Servicios concierge",i:"Cuéntenos qué necesita y lo gestionaremos.",c:["#9a7b2f","#faf6ea","#dccb9c"],f:[N,A,T,M,["ini","Día de inicio","date","",1,1],["fin","Día de finalización","date","",1,1],["obs","Petición en observaciones","area","",0,1]]}
};
let cur="rest";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fld(x){const[id,l,ty,o,h,r,hint,ph]=x;const req=r?'<span class="req">*</span>':'';let c;
 const rq=r?' required':'';
 if(ty==="sel")c=`<select name="${id}"${rq}><option value="">${ph||"Pulse y elija una opción"}</option>${o.map(v=>`<option>${esc(v)}</option>`).join("")}</select>`;
 else if(ty==="bud")c=`<select name="${id}" data-bud="1"><option value="">Seleccione un rango</option>${o.map(v=>`<option>${esc(v)}</option>`).join("")}</select><input name="${id}_o" type="text" inputmode="numeric" placeholder="Indique el importe en €" hidden style="margin-top:8px">`;
 else if(ty==="area")c=`<textarea name="${id}" class="${cur==="conc"?"big":""}"${rq} placeholder="${cur==="conc"?"Describa aquí su petición…":"Notas del cliente…"}"></textarea>`;
 else if(ty==="tel")c=`<div class="ph"><select name="pref">${PRE.map(v=>`<option>${v}</option>`).join("")}</select><input name="tel" type="tel" inputmode="tel" placeholder="Número"${rq}></div><div class="pv" id="pv"></div>`;
 else if(ty==="num")c=`<input name="${id}" type="number" min="0" inputmode="numeric" placeholder="Nº"${rq}>`;
 else c=`<input name="${id}" type="${ty}"${rq}>`;
 return `<div class="f${h?" h":""}" data-id="${id}"${id==="tipo"?" hidden":""}><label>${l}${req}${hint?`<span class="hint">${hint}</span>`:""}</label>${c}</div>`}
function show(k){cur=k;const d=F[k],r=document.documentElement.style;
 [["--a",0],["--at",1],["--am",2]].forEach(([v,i])=>r.setProperty(v,d.c[i]));
 $("#ttl").textContent=d.t.toUpperCase();$("#intro").textContent=d.i;
 $("#frm").innerHTML=d.f.map(fld).join("")+'<button class="go" type="submit">Enviar solicitud</button>';
 $("#frm").style.display="";$("#done").style.display="none";
 document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===k));scrollTo({top:0})}
$("#tabs").innerHTML=Object.entries(F).map(([k,d])=>`<button role="tab" data-k="${k}">${d.t}</button>`).join("");
$("#tabs").onclick=e=>{if(e.target.dataset.k)show(e.target.dataset.k)};
const tel=f=>(f.pref.value.split(" ")[0]+" "+f.tel.value.replace(/\s+/g,"")).trim();
$("#frm").addEventListener("input",e=>{const f=$("#frm");
 if(e.target.dataset.bud){const o=f.elements[e.target.name+"_o"],on=e.target.value==="Otro importe";o.hidden=!on;if(!on)o.value=""}
 if(f.pref){$("#pv").textContent=f.tel.value?"Se enviará como: "+tel(f):""}
 if(f.rest){const t=f.querySelector('[data-id=tipo]'),on=HAM.includes(f.rest.value);t.hidden=!on;if(!on)f.tipo.value=""}});
$("#frm").addEventListener("submit",e=>{e.preventDefault();const f=e.target;
 const bad=[...f.elements].find(x=>x.name&&x.required&&!x.closest("[hidden]")&&!x.value);
 if(bad){bad.focus();bad.reportValidity?.();return}
 if(f.mail.value&&!/^\S+@\S+\.\S+$/.test(f.mail.value)){f.mail.focus();f.mail.setCustomValidity("Email no válido");f.mail.reportValidity();f.mail.setCustomValidity("");return}
 let s=F[cur].t.toUpperCase()+"\n\n";
 F[cur].f.forEach(([id,l])=>{const c=f.querySelector(`[data-id=${id}]`);if(!c||c.hidden)return;
  let v=id==="tel"?(f.tel.value?tel(f):""):f[id].value;if(v==="Otro importe")v=(f.elements[id+"_o"].value||"Otro importe")+" €";if(v)s+=l+": "+v+"\n"});
 s=s.trim();$("#sum").textContent=s;
 const em=$("#em");
 if(EMAIL_DESTINO){const nom=[f.nombre?.value,f.apellido?.value].filter(Boolean).join(" ");
  em.href="mailto:"+EMAIL_DESTINO+"?subject="+encodeURIComponent("Solicitud "+F[cur].t+(nom?" – "+nom:""))+"&body="+encodeURIComponent(s);em.hidden=false}
 f.style.display="none";$("#done").style.display="block";scrollTo({top:0})});
$("#cp").onclick=async e=>{try{await navigator.clipboard.writeText($("#sum").textContent);e.target.textContent="¡Copiado!"}catch(_){const r=document.createRange();r.selectNodeContents($("#sum"));getSelection().removeAllRanges();getSelection().addRange(r);e.target.textContent="Selecciónelo y copie"}};
$("#dl").onclick=()=>{const b=new Blob([$("#sum").textContent],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="solicitud-"+cur+".txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("#nw").onclick=()=>show(cur);
show("rest");
</script>
</body>
</html>
